<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond carré arrondi bleu marine -->
  <rect x="10" y="10" width="180" height="180" rx="32" ry="32" fill="url(#grad1)"/>
  
  <!-- Structure / building en arrière-plan -->
  <g opacity="0.15" fill="#ffffff">
    <rect x="30" y="90" width="20" height="80" rx="2"/>
    <rect x="56" y="70" width="20" height="100" rx="2"/>
    <rect x="82" y="110" width="20" height="60" rx="2"/>
  </g>
  
  <!-- Lettre B stylisée (BET) -->
  <g>
    <!-- Barre verticale du B -->
    <rect x="55" y="55" width="18" height="90" rx="4" fill="url(#grad2)"/>
    
    <!-- Boucle supérieure du B -->
    <path d="M 73 55 L 110 55 Q 138 55 138 78 Q 138 100 110 100 L 73 100 Z" 
          fill="url(#grad2)"/>
    <path d="M 83 65 L 108 65 Q 126 65 126 78 Q 126 90 108 90 L 83 90 Z" 
          fill="#1a2a3a"/>
    
    <!-- Boucle inférieure du B -->
    <path d="M 73 100 L 115 100 Q 148 100 148 122 Q 148 145 115 145 L 73 145 Z" 
          fill="url(#grad2)"/>
    <path d="M 83 110 L 113 110 Q 136 110 136 122 Q 136 135 113 135 L 83 135 Z" 
          fill="#1a2a3a"/>
  </g>
  
  <!-- Petite barre de mesure (accent technique) -->
  <g fill="#3498db" opacity="0.9">
    <rect x="140" y="155" width="30" height="4" rx="2"/>
    <rect x="140" y="163" width="20" height="4" rx="2"/>
    <rect x="140" y="171" width="25" height="4" rx="2"/>
  </g>
</svg>